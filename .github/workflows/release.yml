name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: ./mvnw -B verify -Drevision="${GITHUB_REF_NAME#v}"
      - run: gh release create "$GITHUB_REF_NAME" target/evoker.jar --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
